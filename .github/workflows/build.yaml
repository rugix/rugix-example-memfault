name: Build

on:
  workflow_dispatch:
  pull_request:
  push:

env:
  DOCKER: docker

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - shell: bash
        id: metadata
        run: |
          VERSION=$(date -u +"%Y%m%d%H%M%S")
          echo "version=${VERSION}" > "${GITHUB_OUTPUT}"
  build:
    name: Build
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - system: customized-pi5
            hardware: rpi4-arm64
          - system: customized-pi4
            hardware: rpi5-arm64
          - system: customized-efi-arm64
            hardware: efi-arm64
          - system: customized-efi-amd64
            hardware: efi-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Configure `binfmt_misc` for Foreign Architectures
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      
      - name: Prepare and Configure
        shell: bash
        id: configure
        env:
          MEMFAULT_PROJECT_KEY: ${{ secrets.MEMFAULT_PROJECT_KEY || '' }}
        run: |
          echo "MEMFAULT_PROJECT_KEY='${MEMFAULT_PROJECT_KEY}'" > .env
          echo "MEMFAULT_SOFTWARE_VERSION=${{ needs.metadata.outputs.version }}" >> .env
          echo "MEMFAULT_HARDWARE_VERSION=${{ matrix.job.hardware }}" >> .env
      
      - name: Build Image and Bundle
        run: mise run build ${{ matrix.job.system }}

      - name: Upload Bundle
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')
        env:
          MEMFAULT_PROJECT_SLUG: ${{ secrets.MEMFAULT_PROJECT_SLUG }}
          MEMFAULT_ORG_SLUG: ${{ secrets.MEMFAULT_ORG_SLUG }}
          MEMFAULT_ORG_TOKEN: ${{ secrets.MEMFAULT_ORG_TOKEN }}
        run: mise run upload ${{ matrix.job.system }}
